# Pushing a tag like android-v1.0.0 builds the signed Android APK, checks it is signed with SDM's
# release key (not the debug key), and publishes it as a GitHub release with its SHA-256
# checksum and the third-party notices (M14f, ADR-0023). The desktop release uses v* tags.
# Actions are pinned to full commit SHAs (the tag is in the comment).
name: Android release

on:
  push:
    tags: ["android-v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      # Chaquopy prepares the app's Python packages with the same Python version (ADR-0024).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: The tag must match the app's version
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "android-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version (app/build.gradle.kts)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Unpack the signing key (a secret; never in Git)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The secret ANDROID_KEYSTORE_BASE64 is missing"
            exit 1
          fi
          # A copy from the Windows clipboard can bring line breaks, spaces or an invisible
          # byte-order mark: keep only the characters of base64 text (found in the first release).
          clean=$(printf '%s' "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=')
          echo "Key text: ${#KEYSTORE_BASE64} characters, ${#clean} after cleaning"
          if ! printf '%s' "$clean" | base64 -d > "$RUNNER_TEMP/sdm-release.jks"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 text"
            exit 1
          fi
          echo "Key file: $(stat -c %s "$RUNNER_TEMP/sdm-release.jks") bytes"
          echo "SDM_KEYSTORE=$RUNNER_TEMP/sdm-release.jks" >> "$GITHUB_ENV"
      - name: Check the key opens with its password and alias
        env:
          SDM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SDM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if ! keytool -list -keystore "$SDM_KEYSTORE" -storepass "$SDM_KEYSTORE_PASSWORD" -alias "$SDM_KEY_ALIAS" > /dev/null; then
            echo "::error::The key doesn't open with ANDROID_KEYSTORE_PASSWORD, or has no alias ANDROID_KEY_ALIAS"
            exit 1
          fi
          echo "The key opens; alias found"
      - name: Test and build the release APK
        env:
          SDM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SDM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SDM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :engine:test :app:testDebugUnitTest :app:assembleRelease
      - name: Check the signature (the release key, never the debug key)
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::The APK is signed with the debug key"
            exit 1
          fi
      - name: Collect the files and their checksums
        run: |
          mkdir -p ../dist/android
          cp app/build/outputs/apk/release/app-release.apk "../dist/android/SDM-android-$VERSION.apk"
          cp THIRD_PARTY_NOTICES.md ../dist/android/
          (cd ../dist/android && sha256sum * > SHA256SUMS.txt)
          {
            cat release-notes.md
            echo
            echo "## SHA-256 checksums"
            echo
            echo '```'
            cat ../dist/android/SHA256SUMS.txt
            echo '```'
          } > ../dist/android-notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --latest=false: "latest release" stays the Windows one, which the README links to.
          gh release create "$GITHUB_REF_NAME" ../dist/android/* --latest=false \
            --title "SDM for Android $VERSION" --notes-file ../dist/android-notes.md
