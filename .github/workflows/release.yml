# Pushing a tag like v1.0.0 builds the installer and the extension, and publishes them in
# one zip as a GitHub release with its SHA-256 checksum (M11, ADR-0019).
# Actions are pinned to full commit SHAs (the tag is in the comment), so a moved tag can't
# change what runs.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write  # to create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - name: The tag must match SDM's version
        shell: pwsh
        run: |
          $version = uv run python -c "import importlib.metadata as m; print(m.version('sdm'))"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} doesn't match SDM's version $version (pyproject.toml)"
          }
          "VERSION=$version" >> $env:GITHUB_ENV
      - run: uv run pytest -q -p no:cacheprovider
      - name: Install Inno Setup if the runner lacks it
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - run: uv run python scripts/build_release.py --installer
      - run: uv run python scripts/build_extensions.py
      - name: Pack one zip (installer + extension) and its checksum
        shell: pwsh
        run: |
          # The owner's choice (2026-11-22): one download. Inside: the installer and the
          # Chromium extension (the installer also carries it). Edge and Firefox use the stores.
          New-Item -ItemType Directory dist/bundle, dist/release | Out-Null
          Copy-Item "dist/SDM-Setup-$env:VERSION.exe" dist/bundle/
          Copy-Item "dist/extension/sdm-chromium-$env:VERSION.zip" dist/bundle/
          $inner = Get-ChildItem dist/bundle | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $inner | Set-Content -Encoding utf8 dist/bundle/SHA256SUMS.txt
          $zip = "dist/release/SDM-$env:VERSION.zip"
          Compress-Archive -Path dist/bundle/* -DestinationPath $zip
          $sum = "$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower())  SDM-$env:VERSION.zip"
          (Get-Content packaging/release-notes.md) -replace '<version>', $env:VERSION |
            Set-Content -Encoding utf8 dist/notes.md
          Add-Content -Encoding utf8 dist/notes.md "", "## SHA-256 checksum", "", '```', $sum, '```'
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist/release).FullName `
            --title "SDM $env:VERSION" --notes-file dist/notes.md
